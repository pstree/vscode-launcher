name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --allow-missing-repository

      - name: Create or update first release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Multi Launch
          body: |
            ## Multi Launch

            Auto-packaged from the latest push.
          files: |
            *.vsix
          draft: false
          prerelease: false
          make_latest: true
